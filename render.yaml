# One-click cloud stream API (no PC needed after deploy)
# https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: ytm-stream
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true
